name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Sestaví widget (vite build) a demo: widget vložený do napodobeniny coderslab.cz,
      # samostatnou stránku a původní prototyp pro porovnání.
      - name: Sestavit widget a web
        run: node scripts/build-site.ts
      - name: Velikost widgetu (cíl do 80 kB gzip)
        run: |
          size=$(gzip -c dist/prace-na-zkousku.js | wc -c)
          echo "prace-na-zkousku.js: $size B gzip"
          test "$size" -lt 81920
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
